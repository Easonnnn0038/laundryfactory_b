spring:
  datasource:
    url: jdbc:mysql://localhost:3306/laundry_factory_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:123456}

factory:
  schema-check:
    enabled: false # This isolated schema-only fixture deliberately has no Flyway history.
  quality-photo-dir: ${java.io.tmpdir}/laundry-factory-test-photos
  security:
    device-tokens: test-device:test-token-at-least-24-characters

knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
