server:
  port: 8081

spring:
  application:
    name: laundry-factory-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/laundry_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FactoryHikariCP
      maximum-pool-size: 15
      minimum-idle: 3
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

factory:
  deadline:
    normal-hours: ${NORMAL_DEADLINE_HOURS:96}
    urgent-hours: ${URGENT_DEADLINE_HOURS:48}
    warning-before-hours: ${WARNING_BEFORE_HOURS:24}

knife4j:
  enable: ${KNIFE4J_ENABLED:true}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.laundry.factory: info
